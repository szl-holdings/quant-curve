name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      # Runs before any third-party package is installed: proves the library,
      # verifier and export tool need only the standard library.
      - name: Stdlib-only tests
        run: |
          python tests/test_verifier.py
          python tests/test_quant_curve.py
          python tests/test_bench_suite_target.py
          python tests/test_sync_results.py
      - name: Install hash-locked test closure
        run: |
          python -m pip install --require-hashes -r requirements/ci/test.txt
          python -m pip install --no-deps -e .
      - name: Full suite, including the FastAPI results route
        run: python -m pytest -q
